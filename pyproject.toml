[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sw-daily"
version = "0.1.0"
description = "Shenwan industry index ETL and qlib dump"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "akshare",
  "pandas",
  "fire",
  "scipy",
  "matplotlib",
  "scikit-learn",
  "plotly",
  "skfolio",
]

[project.scripts]
sw-daily = "sw_daily.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
